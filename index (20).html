<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Crocette FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Colori Tailwind collegati alle variabili CSS (cambiano da soli in dark mode)
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', surface: 'var(--surface)', surface2: 'var(--surface-2)',
          ink: 'var(--ink)', muted: 'var(--muted)', line: 'var(--line)',
          accent: 'var(--accent)', 'accent-soft': 'var(--accent-soft)', 'on-accent': 'var(--on-accent)',
          ok: 'var(--ok)', 'ok-soft': 'var(--ok-soft)', 'ok-line': 'var(--ok-line)',
          no: 'var(--no)', 'no-soft': 'var(--no-soft)', 'no-line': 'var(--no-line)',
          gold: 'var(--gold)', 'gold-soft': 'var(--gold-soft)'
        },
        fontFamily: {
          sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          display: ['Fraunces', 'Georgia', 'serif']
        }
      }
    }
  };
</script>
<style>
  /* ───────── Tema caldo: variabili ───────── */
  :root {
    --bg: #FBF3E4;          /* crema */
    --surface: #FFFAF0;
    --surface-2: #F6EAD5;
    --ink: #3E2A1E;         /* marrone scuro */
    --muted: #7A6556;
    --line: #E7D6BC;
    --accent: #B9532B;      /* terracotta / arancio bruciato */
    --accent-soft: #F7E0D2;
    --on-accent: #FFFFFF;
    --ok: #5B6B24;          /* verde oliva */
    --ok-soft: #EAEECF;
    --ok-line: #A5B05C;
    --no: #A63A2C;          /* rosso mattone */
    --no-soft: #F7DDD6;
    --no-line: #D58C7F;
    --gold: #C48A0B;        /* giallo ambra */
    --gold-soft: #FBECC4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1F1712; --surface: #2A1F18; --surface-2: #34271E;
      --ink: #F4E7D4; --muted: #BFA891; --line: #4B3A2D;
      --accent: #E57F48; --accent-soft: #4C2E1E; --on-accent: #1F1712;
      --ok: #B0C060; --ok-soft: #2F3518; --ok-line: #6E7B33;
      --no: #E8897A; --no-soft: #4A2620; --no-line: #8D463B;
      --gold: #EBB84F; --gold-soft: #4A3A14;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1F1712; --surface: #2A1F18; --surface-2: #34271E;
    --ink: #F4E7D4; --muted: #BFA891; --line: #4B3A2D;
    --accent: #E57F48; --accent-soft: #4C2E1E; --on-accent: #1F1712;
    --ok: #B0C060; --ok-soft: #2F3518; --ok-line: #6E7B33;
    --no: #E8897A; --no-soft: #4A2620; --no-line: #8D463B;
    --gold: #EBB84F; --gold-soft: #4A3A14;
    color-scheme: dark;
  }
  html { -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; }
  .stem { white-space: pre-line; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chip[aria-pressed="true"] .dot { background: var(--on-accent); }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2s; } }
  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body class="min-h-screen bg-bg text-ink antialiased">

<div id="app" class="mx-auto w-full max-w-3xl px-4 pb-32 pt-6 sm:px-6"></div>
<div id="nextbar" class="fixed inset-x-0 bottom-0 z-20 hidden border-t border-line bg-surface px-4 py-3" style="padding-bottom:max(.75rem, env(safe-area-inset-bottom))">
  <div class="mx-auto flex max-w-3xl justify-end"><button id="nextbtn" type="button"
    class="inline-flex items-center gap-2 rounded-xl bg-accent px-6 py-3 text-sm font-semibold text-on-accent shadow-sm transition hover:opacity-90">Avanti →</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, serverTimestamp,
  query, where, limit, getDocs, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { DATA } from './database/questions.js';

/* ═════════════════════════ FIREBASE ═════════════════════════ */
const firebaseConfig = {
  apiKey: "AIzaSyBo0BA4yYW_VAcRH-iIVuTGzVnzfApEpoU",
  authDomain: "quizeoa-7ddda.firebaseapp.com",
  projectId: "quizeoa-7ddda",
  storageBucket: "quizeoa-7ddda.firebasestorage.app",
  messagingSenderId: "454514377159",
  appId: "1:454514377159:web:e3a1e923505f875fd959e2",
  measurementId: "G-8LZQ0EN42F"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ═════════════════════════ STATO GLOBALE ═════════════════════════ */
let currentUser = null;
let suppressAuthRender = false;   // true durante la registrazione (evita un render prima di updateProfile)
let userProgress = {};            // { [codeCapitolo]: { badge: 'oro'|'argento'|'bronzo'|null, bestScore: number } }
let authRequestId = 0;            // protegge da risposte Firestore "vecchie" (race condition)
let mixQuestions = false;         // mescola l'ordine delle DOMANDE (le opzioni NON si mescolano mai)
let authMode = 'login';
let S = null;                     // stato del quiz in corso

const BADGE_RANK  = { bronzo: 1, argento: 2, oro: 3 };
const BADGE_EMOJI = { bronzo: '🥉', argento: '🥈', oro: '🥇' };
const BADGE_LABEL = { bronzo: 'Bronzo', argento: 'Argento', oro: 'Oro' };
const badgeFor = pct => pct >= 100 ? 'oro' : pct >= 70 ? 'argento' : pct >= 40 ? 'bronzo' : null;
const examLabel = size => `Simulazione (${size} domande)`;

/* ═════════════════════════ DATI ═════════════════════════ */
DATA.forEach(c => c.q.forEach((q, qi) => { q.id = `${c.code}.${qi}`; q.chapter = c.code; }));
const ALL  = DATA.flatMap(c => c.q);
const TOT  = ALL.length;
const BYID = Object.fromEntries(ALL.map(q => [q.id, q]));

// Taglie disponibili per la simulazione (mai più domande di quante ne esistano)
const EXAM_SIZES = (() => {
  const base = [5, 10, 15, 20, 30, 50].filter(n => n < TOT);
  if (TOT <= 50 && !base.includes(TOT)) base.push(TOT);
  if (!base.length) base.push(TOT);
  return base.sort((a, b) => a - b);
})();

/* ═════════════════════════ UTILITÀ ═════════════════════════ */
const app = document.getElementById('app');
const nextbar = document.getElementById('nextbar');
const nextbtn = document.getElementById('nextbtn');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const displayNameOf = u => (u && u.displayName && u.displayName.trim()) || 'Utente Anonimo';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

const BTN = 'inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition focus:outline-none disabled:cursor-not-allowed disabled:opacity-50';
const BTN_PRIMARY = `${BTN} bg-accent text-on-accent shadow-sm hover:opacity-90`;
const BTN_GHOST   = `${BTN} border border-line bg-surface text-ink hover:bg-surface2`;
const CARD = 'rounded-2xl border border-line bg-surface p-4 shadow-sm sm:p-5';

const showNext = on => nextbar.classList.toggle('hidden', !on);

/* — domande a risposta numerica (type: "number") — */
const isNumQ = q => q?.type === 'number';
// "3,5" e "3.5" sono equivalenti; stringa vuota / non numerica → null
const parseNum = v => {
  const t = String(v ?? '').trim().replace(',', '.');
  if (t === '') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
};
// Confronto numerico: tolleranza minima per gli errori di virgola mobile + eventuale q.tol (tolleranza assoluta)
const numEquals = (given, expected, tol = 0) => {
  const e = parseNum(expected);
  if (given === null || e === null) return false;
  return Math.abs(given - e) <= Math.max(Number(tol) || 0, 1e-9 * Math.max(1, Math.abs(e)));
};
/* — domande multi-slot (type: "multi-slot"): un menu a tendina per ogni elemento di q.slots — */
const isMultiQ = q => q?.type === 'multi-slot' && Array.isArray(q.slots);
// Testo della risposta esatta (opzione scelta, valore numerico oppure combinazione dei menu)
const correctText = q => isMultiQ(q) ? q.slots.map(sl => `${sl.label ?? ''}${sl.o?.[sl.a] ?? ''}`.trim()).join(' · ')
                       : isNumQ(q) ? String(q.a) : (q.o?.[q.a] ?? '');

/* — tema — */
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function currentThemeIsDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function toggleTheme() { const t = currentThemeIsDark() ? 'light' : 'dark'; applyTheme(t); lsSet('quiz.theme', t); }
applyTheme(lsGet('quiz.theme', ''));
mixQuestions = lsGet('quiz.mixQuestions', '0') === '1';

/* — domande sbagliate (localStorage) — */
const WRONG_KEY = 'quiz.wrong';
function loadWrong() { try { const a = JSON.parse(lsGet(WRONG_KEY, '[]')); return Array.isArray(a) ? a.filter(id => BYID[id]) : []; } catch (e) { return []; } }
function saveWrong(a) { lsSet(WRONG_KEY, JSON.stringify([...new Set(a)])); }
function markWrong(id)  { const a = loadWrong(); if (!a.includes(id)) { a.push(id); saveWrong(a); } }
function clearWrong(id) { const a = loadWrong(); if (a.includes(id)) saveWrong(a.filter(x => x !== id)); }

/* ═════════════════════════ AUTENTICAZIONE ═════════════════════════ */
function mapAuthError(code) {
  return ({
    'auth/invalid-email': 'Indirizzo email non valido.',
    'auth/missing-password': 'Inserisci la password.',
    'auth/weak-password': 'Password troppo debole (minimo 6 caratteri).',
    'auth/email-already-in-use': 'Esiste già un account con questa email.',
    'auth/user-not-found': 'Email o password non corretti.',
    'auth/wrong-password': 'Email o password non corretti.',
    'auth/invalid-credential': 'Email o password non corretti.',
    'auth/too-many-requests': 'Troppi tentativi. Riprova tra qualche minuto.',
    'auth/network-request-failed': 'Errore di rete. Controlla la connessione.'
  })[code] || 'Si è verificato un errore. Riprova.';
}

function authScreen() {
  showNext(false);
  const reg = authMode === 'register';
  app.innerHTML = `
  <div class="mx-auto mt-6 max-w-md sm:mt-12">
    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-accent-soft text-2xl">⚙️</div>
      <h1 class="font-display text-3xl font-bold text-ink">Quiz Crocette FM</h1>
      <p class="mt-1 text-sm text-muted">${reg ? 'Crea il tuo account per salvare badge e classifica' : 'Accedi per continuare'}</p>
    </div>
    <form id="authform" class="${CARD} space-y-4" novalidate>
      ${reg ? `<label class="block text-sm font-medium">Nome utente
        <input id="au-name" type="text" autocomplete="nickname" maxlength="24" required
          class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-ink placeholder:text-muted" placeholder="Come vuoi comparire in classifica"></label>` : ''}
      <label class="block text-sm font-medium">Email
        <input id="au-email" type="email" autocomplete="email" required
          class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-ink placeholder:text-muted" placeholder="nome@esempio.it"></label>
      <label class="block text-sm font-medium">Password
        <input id="au-pass" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required minlength="6"
          class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-ink placeholder:text-muted" placeholder="Almeno 6 caratteri"></label>
      <div id="au-err" class="hidden rounded-xl border border-no-line bg-no-soft px-3 py-2 text-sm text-no" role="alert"></div>
      <button id="au-submit" type="submit" class="${BTN_PRIMARY} w-full">${reg ? 'Registrati' : 'Accedi'}</button>
    </form>
    <p class="mt-4 text-center text-sm text-muted">${reg ? 'Hai già un account?' : 'Non hai un account?'}
      <button id="au-switch" type="button" class="font-semibold text-accent underline underline-offset-2">${reg ? 'Accedi' : 'Registrati'}</button></p>
    <div class="mt-6 text-center"><button id="au-theme" type="button" class="text-xs text-muted underline underline-offset-2">Cambia tema chiaro/scuro</button></div>
  </div>`;
  $('au-switch').onclick = () => { authMode = reg ? 'login' : 'register'; authScreen(); };
  $('au-theme').onclick = toggleTheme;
  $('authform').onsubmit = async e => {
    e.preventDefault();
    const err = $('au-err'), btn = $('au-submit');
    const showErr = m => { err.textContent = m; err.classList.remove('hidden'); };
    err.classList.add('hidden');
    const email = $('au-email').value.trim(), pass = $('au-pass').value;
    const name = reg ? $('au-name').value.trim() : '';
    if (reg && !name) return showErr('Scegli un nome utente.');
    if (!email) return showErr('Inserisci la tua email.');
    if (!pass) return showErr('Inserisci la password.');
    btn.disabled = true; btn.textContent = 'Attendi…';
    try {
      if (reg) {
        suppressAuthRender = true;                        // evita che onAuthStateChanged renderizzi prima del displayName
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        suppressAuthRender = false;
        currentUser = auth.currentUser;
        afterAuthReady();
      } else {
        await signInWithEmailAndPassword(auth, email, pass);   // il resto lo fa onAuthStateChanged
      }
    } catch (ex) {
      suppressAuthRender = false;
      showErr(mapAuthError(ex.code));
      btn.disabled = false; btn.textContent = reg ? 'Registrati' : 'Accedi';
    }
  };
}

async function doLogout() {
  authRequestId++;                 // invalida eventuali caricamenti in corso
  try { await signOut(auth); } catch (e) { console.error(e); }
}

/* ═════════════════════════ FIRESTORE: PROGRESSI & BADGE ═════════════════════════ */
async function loadUserProgress(uid) {
  const snap = await getDoc(doc(db, 'userProgress', uid));
  return snap.exists() ? (snap.data()?.progress ?? {}) : {};
}

/* Aggiorna SOLO se la nuova percentuale supera il record. Deep merge con setDoc + merge. */
async function registerChapterAttempt(code, pct) {
  const prev = userProgress?.[code];
  const prevBest = prev?.bestScore;
  if (typeof prevBest === 'number' && pct <= prevBest) {
    return { updated: false, bestScore: prevBest, badge: prev?.badge ?? null, prevBadge: prev?.badge ?? null };
  }
  const badge = badgeFor(pct);
  const docRef = doc(db, 'userProgress', currentUser.uid);
  await setDoc(docRef, { progress: { [code]: { badge, bestScore: pct } } }, { merge: true });
  userProgress = { ...userProgress, [code]: { badge, bestScore: pct } };
  return { updated: true, bestScore: pct, badge, prevBadge: prev?.badge ?? null };
}

async function saveToLeaderboard(score, total, pct, size) {
  await addDoc(collection(db, 'leaderboard'), {
    userId: currentUser.uid,
    username: displayNameOf(currentUser),
    score, total, percentage: pct,
    exam: size,
    label: examLabel(size),
    createdAt: serverTimestamp()
  });
}

/* ═════════════════════════ SCHERMATE DI SERVIZIO ═════════════════════════ */
function loadingScreen(msg = 'Caricamento…') {
  showNext(false);
  app.innerHTML = `<div class="grid min-h-[60vh] place-items-center text-center"><div class="flex flex-col items-center gap-4">
    <div class="spinner" role="status" aria-label="Caricamento"></div><p class="text-sm text-muted">${esc(msg)}</p></div></div>`;
}
function errorScreen(msg) {
  showNext(false);
  app.innerHTML = `<div class="mx-auto mt-16 max-w-md ${CARD} text-center">
    <p class="mb-1 text-lg font-semibold text-no">Qualcosa non ha funzionato</p>
    <p class="mb-4 text-sm text-muted">${esc(msg)}</p>
    <div class="flex justify-center gap-2"><button id="er-retry" class="${BTN_PRIMARY}">Riprova</button>
    <button id="er-out" class="${BTN_GHOST}">Esci</button></div></div>`;
  $('er-retry').onclick = afterAuthReady;
  $('er-out').onclick = doLogout;
}

/* ═════════════════════════ HOME ═════════════════════════ */
function renderChaptersUI(progressData) {
  const rows = DATA.map((c, i) => {
    const p = progressData?.[c.code];
    const badge = p?.badge;
    const best = p?.bestScore;
    const badgeCell = badge
      ? `<span class="text-xl leading-none" title="${BADGE_LABEL[badge]}" aria-label="Badge ${BADGE_LABEL[badge]}">${BADGE_EMOJI[badge]}</span>`
      : `<span class="inline-block h-2 w-2 rounded-full bg-line" title="Nessun badge" aria-label="Nessun badge"></span>`;
    return `
    <button type="button" data-ch="${i}" class="group grid w-full grid-cols-[minmax(0,1fr)_2rem_3rem_auto] items-center gap-2 rounded-xl border border-line bg-surface px-3 py-3 text-left shadow-sm transition hover:border-accent hover:bg-surface2 sm:gap-4 sm:px-4">
      <span class="min-w-0">
        <span class="block truncate text-[15px] font-semibold text-ink">${esc(c.title)}</span>
        <span class="block truncate text-xs text-muted">${esc(c.code)} · ${c.q.length} domande</span>
      </span>
      <span class="flex items-center justify-center">${badgeCell}</span>
      <span class="text-right font-mono text-xs text-muted sm:text-sm">${typeof best === 'number' ? best : 0}%</span>
      <span class="inline-flex items-center gap-1 rounded-full bg-accent-soft px-2.5 py-1 text-xs font-semibold text-accent transition group-hover:translate-x-0.5 sm:px-3">
        <span class="hidden sm:inline">Gioca</span><span aria-hidden="true">→</span>
      </span>
    </button>`;
  }).join('');
  return `
    <div class="mb-1.5 hidden grid-cols-[minmax(0,1fr)_2rem_3rem_auto] gap-4 px-4 text-[11px] font-semibold uppercase tracking-wider text-muted sm:grid">
      <span>Capitolo</span><span class="text-center">Badge</span><span class="text-right">Record</span><span class="w-[4.5rem]"></span>
    </div>
    <div class="flex flex-col gap-2">${rows}</div>`;
}

function home(progressData = userProgress) {
  showNext(false); S = null;
  const wrongN = loadWrong().length;
  window.scrollTo(0, 0);
  app.innerHTML = `
  <header class="mb-6 flex items-start justify-between gap-3">
    <div>
      <h1 class="font-display text-2xl font-bold sm:text-3xl">Quiz Crocette FM</h1>
      <p class="mt-0.5 text-sm text-muted">Ciao, <strong class="font-semibold text-ink">${esc(displayNameOf(currentUser))}</strong> · ${TOT} domande in ${DATA.length} capitoli</p>
    </div>
    <div class="flex flex-none items-center gap-2">
      <button id="h-theme" type="button" class="${BTN_GHOST} !px-3" aria-label="Cambia tema">${currentThemeIsDark() ? '☀️' : '🌙'}</button>
      <button id="h-logout" type="button" class="${BTN_GHOST}">Esci</button>
    </div>
  </header>

  <section class="${CARD} mb-4">
    <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-base font-semibold">Modalità di studio</h2>
      <button id="mix" type="button" class="chip inline-flex items-center gap-2 rounded-full border border-line bg-surface px-3.5 py-1.5 text-sm font-medium transition hover:border-accent" aria-pressed="${mixQuestions}">
        <span class="dot inline-block h-2 w-2 rounded-full bg-accent"></span>Mescola l'ordine delle domande</button>
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      <div class="rounded-xl border border-line bg-bg p-3">
        <p class="text-sm font-semibold">Simulazione d'esame</p>
        <p class="mb-2 text-xs text-muted">Domande casuali da tutto il database · entra in classifica</p>
        <div class="flex items-center gap-2">
          <select id="exam-size" class="min-w-0 flex-1 rounded-xl border border-line bg-surface px-3 py-2.5 text-sm text-ink" aria-label="Numero di domande">
            ${EXAM_SIZES.map(n => `<option value="${n}">${n} domande</option>`).join('')}
          </select>
          <button id="exam-start" type="button" class="${BTN_PRIMARY}">Avvia</button>
        </div>
      </div>
      <div class="flex flex-col gap-2 rounded-xl border border-line bg-bg p-3">
        <p class="text-sm font-semibold">Ripasso e classifica</p>
        <p class="text-xs text-muted">Ripassa gli errori o guarda i migliori punteggi</p>
        <div class="mt-auto flex flex-wrap gap-2">
          <button id="wrong-start" type="button" class="${BTN_GHOST} flex-1" ${wrongN ? '' : 'disabled'}>Solo le sbagliate${wrongN ? ` (${wrongN})` : ''}</button>
          <button id="lb-open" type="button" class="${BTN_GHOST} flex-1">🏆 Classifica</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2 class="mb-2 mt-6 text-base font-semibold">Capitoli</h2>
    <p class="mb-3 text-xs text-muted">🥇 100% · 🥈 70–99% · 🥉 40–69% — il record si aggiorna solo se lo migliori.</p>
    <div id="chapters">${renderChaptersUI(progressData)}</div>
  </section>`;

  $('h-theme').onclick = () => { toggleTheme(); home(userProgress); };
  $('h-logout').onclick = doLogout;
  $('mix').onclick = e => {
    mixQuestions = !mixQuestions;
    e.currentTarget.setAttribute('aria-pressed', mixQuestions);
    lsSet('quiz.mixQuestions', mixQuestions ? '1' : '0');
  };
  $('exam-start').onclick = () => {
    const size = Math.min(+$('exam-size').value, TOT);
    start(shuffle(ALL.slice()).slice(0, size), examLabel(size), null, 'exam', { size });
  };
  $('wrong-start').onclick = () => {
    const list = loadWrong().map(id => BYID[id]).filter(Boolean);
    if (list.length) start(list, 'Solo le sbagliate', null, 'wrong', {});
  };
  $('lb-open').onclick = () => leaderboardScreen(+$('exam-size').value);
  document.querySelectorAll('[data-ch]').forEach(b => {
    b.onclick = () => { const c = DATA[+b.dataset.ch]; start(c.q.slice(), c.title, c.code, 'chapter', { code: c.code }); };
  });
}

/* ═════════════════════════ QUIZ ═════════════════════════ */
function start(list, title, key, mode, meta) {
  // Domande: ordine casuale solo se attivo il toggle. Opzioni: SEMPRE in ordine originale (nessun shuffle di "ord").
  const ordered = mixQuestions ? shuffle(list.slice()) : list.slice();
  const items = ordered.map(q => ({ q, ord: (isNumQ(q) || isMultiQ(q)) ? [] : q.o.map((_, k) => k) }));
  S = { items, title, key, mode, meta: meta || {}, i: 0, right: 0, wrong: [], answered: false };
  render();
}

function render() {
  const it = S.items[S.i], q = it.q, n = S.items.length;
  window.scrollTo(0, 0);
  showNext(false);
  S.answered = false;
  const letters = 'ABCDEFGH';
  app.innerHTML = `
  <div class="mb-5">
    <div class="mb-2 flex items-center justify-between gap-3 text-sm">
      <button id="q-exit" type="button" class="text-muted underline underline-offset-2 hover:text-ink">← Esci</button>
      <span class="truncate font-medium text-muted">${esc(S.title)}</span>
      <span class="flex-none font-mono text-xs text-muted">${S.i + 1}/${n}</span>
    </div>
    <div class="h-2 overflow-hidden rounded-full bg-line" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}">
      <div class="h-full rounded-full bg-accent transition-all" style="width:${S.i / n * 100}%"></div>
    </div>
  </div>
  <article class="${CARD}">
    <h2 class="stem text-[17px] font-semibold leading-snug sm:text-lg">${esc(q.s)}</h2>
    ${q.img ? `<figure id="q-fig" class="my-4">
      <a href="${esc(q.img)}" target="_blank" rel="noopener">
        <img src="${esc(q.img)}" alt="Figura relativa alla domanda" loading="lazy"
          class="mx-auto max-h-80 w-auto max-w-full rounded-xl border border-line bg-white object-contain p-1.5 shadow-sm"></a>
    </figure>` : ''}
    ${isNumQ(q) ? `
    <div id="numbox" class="mt-4">
      <label for="num-in" class="mb-1.5 block text-sm font-medium text-muted">Inserisci il valore numerico</label>
      <div class="flex flex-col gap-2.5 sm:flex-row">
        <input id="num-in" type="number" step="any" inputmode="decimal" autocomplete="off" placeholder="Es. 1,339"
          class="min-w-0 flex-1 rounded-xl border-2 border-line bg-bg px-4 py-3 font-mono text-lg text-ink shadow-sm transition placeholder:text-muted focus:border-accent">
        <button id="num-ok" type="button" class="${BTN_PRIMARY} px-6 py-3">Conferma</button>
      </div>
      <p id="num-hint" class="mt-2 hidden text-sm text-no" role="alert">Inserisci un numero valido prima di confermare.</p>
    </div>` : isMultiQ(q) ? `
    <div id="slotbox" class="mt-4">
      <div class="flex flex-col gap-3 rounded-xl border border-line bg-bg p-3.5 sm:p-4">
        ${q.slots.map((sl, i) => `
        <div class="flex items-center gap-3">
          <label for="slot-${i}" class="min-w-[2.5rem] flex-none whitespace-pre font-mono text-sm font-semibold text-ink sm:text-base">${esc(sl.label ?? `Slot ${i + 1}`)}</label>
          <select id="slot-${i}" data-slot="${i}" class="slot-sel min-w-0 flex-1 rounded-xl border-2 border-line bg-surface px-3 py-2.5 font-mono text-[15px] text-ink shadow-sm transition focus:border-accent">
            <option value="" selected disabled>Scegli…</option>
            ${sl.o.map((opt, k) => `<option value="${k}">${esc(opt)}</option>`).join('')}
          </select>
        </div>`).join('')}
      </div>
      <button id="slot-ok" type="button" class="${BTN_PRIMARY} mt-3 w-full px-6 py-3 sm:w-auto">Conferma Risposta</button>
      <p id="slot-hint" class="mt-2 hidden text-sm text-no" role="alert">Seleziona un valore in tutti i menu prima di confermare.</p>
    </div>` : `
    <div id="opts" class="mt-4 flex flex-col gap-2.5">
      ${it.ord.map((k, pos) => `
        <button type="button" data-pos="${pos}" class="opt flex w-full items-start gap-3 rounded-xl border border-line bg-surface px-3.5 py-3 text-left text-[15px] leading-snug transition hover:border-accent hover:bg-surface2">
          <span class="mt-px grid h-6 w-6 flex-none place-items-center rounded-full bg-surface2 text-xs font-bold text-muted">${letters[pos] || pos + 1}</span>
          <span class="min-w-0 flex-1">${esc(q.o[k])}</span>
          <span class="mark flex-none text-base font-bold" aria-hidden="true"></span>
        </button>`).join('')}
    </div>`}
    <div id="fb" class="mt-4 hidden rounded-xl px-3.5 py-3 text-sm font-medium" role="status"></div>
  </article>`;
  $('q-exit').onclick = () => { if (confirm('Uscire dal quiz? I progressi di questa sessione andranno persi.')) home(userProgress); };
  if (isNumQ(q)) {
    const inp = $('num-in');
    $('num-ok').onclick = () => answer(inp.value);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); answer(inp.value); } });
    inp.addEventListener('input', () => $('num-hint').classList.add('hidden'));
    inp.focus({ preventScroll: true });
  } else if (isMultiQ(q)) {
    $('slot-ok').onclick = () => answer();
    document.querySelectorAll('.slot-sel').forEach(sel => sel.addEventListener('change', () => $('slot-hint').classList.add('hidden')));
  } else {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.pos));
  }
  const img = app.querySelector('#q-fig img');
  if (img) img.addEventListener('error', () => {
    $('q-fig').innerHTML = `<p class="rounded-xl border border-dashed border-line bg-surface2 px-3 py-4 text-center text-xs text-muted">Immagine non trovata: <code>${esc(q.img)}</code></p>`;
  });
}

/* answer(input): per le domande a scelta riceve la posizione dell'opzione cliccata;
   per le domande numeriche (q.type === 'number') riceve il valore digitato;
   per le multi-slot (q.type === 'multi-slot') legge direttamente gli indici selezionati nei <select>. */
function answer(input) {
  if (S.answered) return;
  const it = S.items[S.i], q = it.q;
  const num = isNumQ(q), multi = isMultiQ(q);
  let right, given = null;
  if (multi) {
    const picked = [...document.querySelectorAll('.slot-sel')].map(sel => sel.value);   // indici (stringhe) scelti
    const missing = picked.findIndex(v => v === '');
    if (!picked.length || missing !== -1) {      // almeno un menu non compilato: non conta come risposta
      $('slot-hint').classList.remove('hidden');
      document.querySelectorAll('.slot-sel')[Math.max(missing, 0)]?.focus();
      return;
    }
    right = q.slots.every((sl, i) => Number(picked[i]) === sl.a);   // TUTTI gli slot devono essere esatti
  } else if (num) {
    given = parseNum(input);
    if (given === null) {                       // input vuoto o non valido: non conta come risposta
      $('num-hint').classList.remove('hidden'); $('num-in').focus();
      return;
    }
    right = numEquals(given, q.a, q.tol);
  } else {
    right = it.ord[input] === q.a;
  }
  S.answered = true;

  if (multi) {
    $('slot-ok').disabled = true; $('slot-hint').classList.add('hidden');
    document.querySelectorAll('.slot-sel').forEach((sel, i) => {
      sel.disabled = true;
      const slotRight = Number(sel.value) === q.slots[i].a;
      sel.classList.remove('border-line', 'bg-surface', 'focus:border-accent');
      sel.classList.add(...(slotRight ? ['border-ok', 'bg-ok-soft', 'text-ok'] : ['border-no', 'bg-no-soft', 'text-no']));
    });
  } else if (num) {
    const inp = $('num-in'), ok = $('num-ok');
    inp.disabled = true; ok.disabled = true;
    inp.classList.remove('border-line', 'bg-bg', 'focus:border-accent');
    inp.classList.add(...(right ? ['border-ok-line', 'bg-ok-soft', 'text-ok'] : ['border-no-line', 'bg-no-soft', 'text-no']));
    $('num-hint').classList.add('hidden');
  } else {
    const pos = input;
    document.querySelectorAll('.opt').forEach((b, p) => {
      b.disabled = true; b.classList.remove('hover:border-accent', 'hover:bg-surface2');
      const mark = b.querySelector('.mark');
      if (it.ord[p] === q.a) { b.classList.remove('border-line', 'bg-surface'); b.classList.add('border-ok-line', 'bg-ok-soft'); mark.textContent = '✓'; mark.classList.add('text-ok'); }
      else if (p === pos)    { b.classList.remove('border-line', 'bg-surface'); b.classList.add('border-no-line', 'bg-no-soft'); mark.textContent = '✗'; mark.classList.add('text-no'); }
      else b.classList.add('opacity-60');
    });
  }

  const fb = $('fb');
  fb.classList.remove('hidden');
  if (right) { S.right++; clearWrong(q.id); fb.className = 'mt-4 rounded-xl border border-ok-line bg-ok-soft px-3.5 py-3 text-sm font-medium text-ok'; fb.textContent = 'Risposta esatta!'; }
  else {
    S.wrong.push(q); markWrong(q.id);
    fb.className = 'mt-4 rounded-xl border border-no-line bg-no-soft px-3.5 py-3 text-sm font-medium text-no';
    fb.textContent = multi ? `Risposta sbagliata — la combinazione esatta è: ${correctText(q)}.`
                        : num ? `Risposta sbagliata — il valore esatto è ${q.a}.` : 'Risposta sbagliata — quella esatta è evidenziata in verde.';
  }
  const last = S.i === S.items.length - 1;
  nextbtn.textContent = last ? 'Vedi risultato' : 'Avanti →';
  nextbtn.onclick = () => { if (last) results(); else { S.i++; render(); } };
  showNext(true);
  nextbtn.focus({ preventScroll: true });
}

/* ═════════════════════════ RISULTATI ═════════════════════════ */
function results() {
  showNext(false);
  window.scrollTo(0, 0);
  const n = S.items.length, right = S.right, pct = Math.round(right / n * 100);
  const mode = S.mode;
  const tone = pct >= 70 ? 'text-ok' : pct >= 40 ? 'text-gold' : 'text-no';
  app.innerHTML = `
  <div class="mx-auto max-w-xl">
    <div class="${CARD} text-center">
      <p class="text-sm text-muted">${esc(S.title)}</p>
      <p class="mt-2 font-display text-6xl font-bold ${tone}">${pct}%</p>
      <p class="mt-1 text-base">${right} risposte esatte su ${n}</p>
      <div id="res-status" class="mt-4 min-h-[3rem] text-sm text-muted">${mode === 'wrong' ? '' : 'Salvataggio in corso…'}</div>
    </div>
    <div class="mt-4 flex flex-wrap justify-center gap-2" id="res-actions"></div>
    ${S.wrong.length ? `<h3 class="mb-2 mt-6 text-base font-semibold">Da rivedere (${S.wrong.length})</h3>
      <div class="flex flex-col gap-2">${S.wrong.map(q => `
        <div class="rounded-xl border border-line bg-surface p-3 text-sm">
          <p class="stem font-medium">${esc(q.s)}</p>
          <p class="mt-1.5 rounded-lg bg-ok-soft px-2.5 py-1.5 text-ok">✓ ${esc(correctText(q))}</p>
        </div>`).join('')}</div>` : ''}
  </div>`;

  const actions = $('res-actions'), status = $('res-status');
  const add = (id, label, cls, fn) => { const b = document.createElement('button'); b.id = id; b.type = 'button'; b.className = cls; b.textContent = label; b.onclick = fn; actions.appendChild(b); };
  const snap = S;   // riferimento stabile per i retry

  if (mode === 'wrong') {
    const still = loadWrong().length;
    status.textContent = still ? `Ti restano ${still} domande sbagliate da ripassare.` : 'Hai ripassato tutte le domande sbagliate. Ottimo!';
    if (still) add('r-again', 'Ripassa ancora', BTN_PRIMARY, () => start(loadWrong().map(id => BYID[id]), 'Solo le sbagliate', null, 'wrong', {}));
  }
  else if (mode === 'chapter') {
    add('r-retry', 'Riprova il capitolo', BTN_PRIMARY, () => { const c = DATA.find(x => x.code === snap.meta.code); start(c.q.slice(), c.title, c.code, 'chapter', { code: c.code }); });
    (async () => {
      try {
        const r = await registerChapterAttempt(snap.meta.code, pct);
        if (r.updated && r.badge) {
          const upgraded = !r.prevBadge || BADGE_RANK[r.badge] > BADGE_RANK[r.prevBadge];
          status.innerHTML = `<div class="rounded-xl border border-gold bg-gold-soft px-3 py-3 text-ink"><span class="text-2xl">${BADGE_EMOJI[r.badge]}</span>
            <p class="mt-1 font-semibold">Badge ${BADGE_LABEL[r.badge]} ${upgraded ? 'sbloccato' : 'confermato'}! Nuovo record: ${pct}%</p>
            <p class="mt-0.5 text-xs text-muted">${r.badge === 'oro' ? 'Capitolo completato alla perfezione.' : 'Rifai il capitolo senza errori per conquistare l\'oro.'}</p></div>`;
        } else if (r.updated) {
          status.textContent = `Nuovo record: ${pct}%. Arriva al 40% per sbloccare il primo badge.`;
        } else {
          status.textContent = `Il tuo record resta ${r.bestScore}%${r.badge ? ' ' + BADGE_EMOJI[r.badge] : ''}. Prova a superarlo!`;
        }
      } catch (e) {
        console.error(e);
        status.innerHTML = `<span class="text-no">Non sono riuscito a salvare i progressi.</span> <button id="r-save" class="font-semibold text-accent underline">Riprova</button>`;
        $('r-save').onclick = () => { S = snap; results(); };
      }
    })();
  }
  else if (mode === 'exam') {
    add('r-retry', 'Nuova simulazione', BTN_PRIMARY, () => start(shuffle(ALL.slice()).slice(0, snap.meta.size), examLabel(snap.meta.size), null, 'exam', snap.meta));
    add('r-lb', '🏆 Vedi Classifica', BTN_GHOST, () => leaderboardScreen(snap.meta.size));
    (async () => {
      try { await saveToLeaderboard(right, n, pct, snap.meta.size); status.textContent = 'Punteggio salvato in classifica ✓'; }
      catch (e) {
        console.error(e);
        status.innerHTML = `<span class="text-no">Punteggio non salvato.</span> <button id="r-save" class="font-semibold text-accent underline">Riprova</button>`;
        $('r-save').onclick = () => { S = snap; results(); };
      }
    })();
  }
  if (snap.wrong.length && mode !== 'wrong') add('r-wrong', 'Ripassa gli errori', BTN_GHOST, () => start(snap.wrong.slice(), 'Solo le sbagliate', null, 'wrong', {}));
  add('r-home', 'Home', BTN_GHOST, () => home(userProgress));
}

/* ═════════════════════════ CLASSIFICA (solo simulazioni) ═════════════════════════ */
async function loadBoard(size, box) {
  box.innerHTML = `<div class="flex justify-center py-10"><div class="spinner"></div></div>`;
  try {
    // Solo filtro di uguaglianza (nessun indice composito necessario); ordinamento lato client.
    const snap = await getDocs(query(collection(db, 'leaderboard'), where('exam', '==', size), limit(200)));
    const rows = snap.docs.map(d => d.data());
    rows.sort((a, b) => (b.percentage - a.percentage) || (b.score - a.score) || ((a.createdAt?.seconds ?? 0) - (b.createdAt?.seconds ?? 0)));
    const top = rows.slice(0, 20);
    if (!top.length) { box.innerHTML = `<p class="py-10 text-center text-sm text-muted">Nessun risultato per questa simulazione. Sii il primo!</p>`; return; }
    box.innerHTML = `<ol class="flex flex-col gap-2">${top.map((r, i) => {
      const me = currentUser && r.userId === currentUser.uid;
      const medal = ['🥇', '🥈', '🥉'][i] || `<span class="font-mono text-xs text-muted">${i + 1}</span>`;
      const date = r.createdAt?.toDate ? r.createdAt.toDate().toLocaleDateString('it-IT') : '';
      return `<li class="flex items-center gap-3 rounded-xl border px-3 py-2.5 ${me ? 'border-accent bg-accent-soft' : 'border-line bg-surface'}">
        <span class="grid w-7 flex-none place-items-center text-lg">${medal}</span>
        <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold">${esc(r.username || 'Utente Anonimo')}${me ? ' <span class="text-xs font-normal text-accent">(tu)</span>' : ''}</span>
          <span class="block text-xs text-muted">${r.score}/${r.total}${date ? ' · ' + date : ''}</span></span>
        <span class="flex-none font-mono text-sm font-semibold">${r.percentage}%</span></li>`;
    }).join('')}</ol>`;
  } catch (e) {
    console.error(e);
    box.innerHTML = `<p class="py-10 text-center text-sm text-no">Impossibile caricare la classifica.<br><span class="text-xs text-muted">${esc(e.code || e.message || '')}</span></p>`;
  }
}

function leaderboardScreen(initialSize) {
  showNext(false); window.scrollTo(0, 0);
  const sel = EXAM_SIZES.includes(initialSize) ? initialSize : EXAM_SIZES[0];
  app.innerHTML = `
  <header class="mb-5 flex items-center justify-between gap-3">
    <h1 class="font-display text-2xl font-bold">🏆 Classifica</h1>
    <button id="lb-home" type="button" class="${BTN_GHOST}">← Home</button>
  </header>
  <div class="${CARD}">
    <label class="mb-4 block text-sm font-medium">Simulazione
      <select id="lb-size" class="mt-1 w-full rounded-xl border border-line bg-bg px-3 py-2.5 text-ink">
        ${EXAM_SIZES.map(n => `<option value="${n}" ${n === sel ? 'selected' : ''}>${examLabel(n)}</option>`).join('')}
      </select></label>
    <div id="lb-box"></div>
  </div>`;
  $('lb-home').onclick = () => home(userProgress);
  $('lb-size').onchange = e => loadBoard(+e.target.value, $('lb-box'));
  loadBoard(sel, $('lb-box'));
}

/* ═════════════════════════ AVVIO: caricamento sicuro ═════════════════════════ */
async function afterAuthReady() {
  const myRequest = ++authRequestId;
  const user = currentUser;
  if (!user) { userProgress = {}; authScreen(); return; }
  loadingScreen('Carico i tuoi progressi…');
  try {
    const progress = await loadUserProgress(user.uid);
    if (myRequest !== authRequestId) return;          // è arrivato un cambio di stato più recente: scarta
    userProgress = progress;
    home(userProgress);
  } catch (e) {
    console.error(e);
    if (myRequest !== authRequestId) return;
    errorScreen('Non riesco a leggere i tuoi progressi da Firestore (' + (e.code || e.message || 'errore') + ').');
  }
}

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (suppressAuthRender) return;
  afterAuthReady();
});

if (!ALL.length) errorScreen('Il database delle domande è vuoto: controlla database/questions.js.');
else loadingScreen('Controllo l\'accesso…');
</script>
